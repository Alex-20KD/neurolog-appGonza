name: SonarCloud Analysis
on:
  push:
    branches: [ mejoras-calidad ]  # Reemplaza con tu rama
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automático en GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Configúralo en GitHub Secrets